[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudpulse"
version = "0.1.0"
description = "Real-time fraud detection with a Feast feature store, closing the train/serve-skew gap."
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
authors = [{ name = "Vignesh Kumar V" }]

dependencies = [
  # data
  "pandas>=2.1,<3",
  "numpy>=1.26,<3",
  "pyarrow>=15",
  "duckdb>=1.0",
  # streaming
  "confluent-kafka>=2.5",
  "redis>=5.0",
  # feature store
  "feast[redis]>=0.40",
  # modelling
  "xgboost>=2.0",
  "lightgbm>=4.3",
  "scikit-learn>=1.4",
  "optuna>=3.6",
  "mlflow>=2.14",
  # serving
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "prometheus-client>=0.20",
  # monitoring
  "evidently>=0.4.25",
  # misc
  "python-dotenv>=1.0",
  "rich>=13.7",
  "typer>=0.12",
  "tqdm>=4.66",
]

[project.optional-dependencies]
stretch = ["ray[tune]>=2.30", "shap>=0.45"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "kaggle>=1.6"]

[project.scripts]
fraudpulse = "fraudpulse.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# scripts/ and docker/ import fraudpulse too; without them here ruff resolves
# the package differently depending on what happens to be on disk, and import
# sorting comes out different locally vs. in CI.
src = ["src", "tests", "scripts", "docker"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
# Stated rather than inferred. Inference depends on the filesystem layout at
# lint time, which differs between a working tree with data/ present and a
# fresh CI checkout - and produces a different import order in each.
known-first-party = ["fraudpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:warnings"
markers = [
  "integration: requires docker services (kafka/redis) to be up",
  "slow: long-running",
]
